theme = "nord-night"

[editor]
line-number = "relative"
completion-replace = true
trim-trailing-whitespace = true
end-of-line-diagnostics = "hint"
color-modes = true
true-color = true

[editor.inline-diagnostics]
cursor-line = "warning"

[editor.cursor-shape]
normal = "block"
insert = "bar"
select = "underline"

[editor.auto-save]
after-delay.enable = true
after-delay.timeout = 3000

[editor.indent-guides]
render = true
skip-levels = 1

[editor.auto-pairs]
'(' = ')'
'{' = '}'
'[' = ']'
'"' = '"'
'`' = '`'
'<' = '>'

[editor.statusline]
left = [
  "mode",
  "spinner",
  "file-name",
  "file-modification-indicator",
]
right = [
  "diagnostics",
  "version-control",
  "position",
  "file-type",
  "register",
]
separator = "|"

[editor.file-picker]
hidden = false # Show hidden files by default.

# ===================
# === Normal Mode ===
# ===================
[keys.normal]
0 = "goto_line_start"
"$" = "goto_line_end"
G = "goto_file_end"
# removes everything to the right of the cursor
D = ["ensure_selections_forward", "extend_to_line_end", "delete_selection"]
# enter select mode and mark line
V = ["select_mode", "extend_to_line_bounds"]
esc = ["collapse_selection", "keep_primary_selection"]
ret = "add_newline_above"
"Cmd-ret" = "add_newline_below"

[keys.normal.space]
q = ":quit"

[keys.normal."="] # minor mode formatting
f = ":format"
w = ":set whitespace.render all"
W = ":set whitespace.render none"
s = ":toggle soft-wrap.enable"
r = ":set rulers [120]"
R = ":set rulers [0]"
l = ":lsp-stop"
L = ":lsp-restart"

[keys.normal.space.f] # minor mode file
f = "file_picker_in_current_directory"
F = "file_picker"
p = "file_picker_in_current_buffer_directory"
P = "buffer_picker"
w = ":write"
c = ":bc"
x = ":bco"
l = ":toggle lsp.display-inlay-hints"
"." = ":toggle file-picker.hidden"
r = ":reload-all"
z = ":reset-diff-change"
b = ":echo %sh{git blame -L %{cursor_line},+1 %{buffer_name}}"
d  = [":vsplit-new", ":lang diff", ":insert-output git diff"]

[keys.normal.space.w] # minor mode window management
h = "jump_view_left"
j = "jump_view_down"
k = "jump_view_up"
l = "jump_view_right"

[keys.normal.C-y] # Yazi open files
y = ":sh wezterm cli split-pane --left --percent 30 -- ${HOME}/.config/helix/scripts/yazi-to-wez.sh $WEZTERM_PANE open > /dev/null"
v = ":sh wezterm cli split-pane --left --percent 30 -- ${HOME}/.config/helix/scripts/yazi-to-wez.sh $WEZTERM_PANE vsplit > /dev/null"
h = ":sh wezterm cli split-pane --left --percent 30 -- ${HOME}/.config/helix/scripts/yazi-to-wez.sh $WEZTERM_PANE hsplit > /dev/null"
Y = ":sh wezterm cli split-pane --left --percent 30 -- ${HOME}/.config/helix/scripts/yazi-to-wez.sh $WEZTERM_PANE open zoom > /dev/null"
V = ":sh wezterm cli split-pane --left --percent 30 -- ${HOME}/.config/helix/scripts/yazi-to-wez.sh $WEZTERM_PANE vsplit zoom > /dev/null"
H = ":sh wezterm cli split-pane --left --percent 30 -- ${HOME}/.config/helix/scripts/yazi-to-wez.sh $WEZTERM_PANE hsplit zoom > /dev/null"

# ===================
# === Select Mode ===
# ===================
[keys.select]
0 = "goto_line_start"
"$" = "goto_line_end"
G = "extend_to_file_end"
